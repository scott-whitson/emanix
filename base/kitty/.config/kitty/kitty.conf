# Font
font_family      JetBrainsMono Nerd Font
font_size        12.0

# Window
window_padding_width 8
confirm_os_window_close 0
hide_window_decorations yes

# Cursor
cursor_shape beam
cursor_blink_interval 0

# Scrollback
scrollback_lines 10000

# Bell
enable_audio_bell no
visual_bell_duration 0

# Colors (Tokyo Night inspired)
foreground #c0caf5
background #1a1b26
selection_foreground #1a1b26
selection_background #c0caf5

color0  #15161e
color8  #414868
color1  #f7768e
color9  #f7768e
color2  #9ece6a
color10 #9ece6a
color3  #e0af68
color11 #e0af68
color4  #7aa2f7
color12 #7aa2f7
color5  #bb9af7
color13 #bb9af7
color6  #7dcfff
color14 #7dcfff
color7  #a9b1d6
color15 #c0caf5

# URL handling
url_color #7aa2f7
url_style curly
detect_urls yes

# Performance
repaint_delay 6
input_delay 1
sync_to_monitor yes
