# -----------------------------------------------
# Kitty Configuration - Tokyo Night
# -----------------------------------------------

# --- Transparency ---
background_opacity 0.85

# --- Font ---
font_family JetBrainsMono Nerd Font
font_size 11.0

# --- Tokyo Night Color Scheme ---
foreground #c0caf5
background #1a1b26

# Black
color0  #15161e
color8  #414868

# Red
color1  #f7768e
color9  #f7768e

# Green
color2  #9ece6a
color10 #9ece6a

# Yellow
color3  #e0af68
color11 #e0af68

# Blue
color4  #7aa2f7
color12 #7aa2f7

# Magenta
color5  #bb9af7
color13 #bb9af7

# Cyan
color6  #7dcfff
color14 #7dcfff

# White
color7  #a9b1d6
color15 #c0caf5

# Cursor
cursor #c0caf5
cursor_text_color #1a1b26
cursor_shape beam
cursor_blink_interval 0

# Selection
selection_foreground #c0caf5
selection_background #33467c

# URL
url_color #73daca
url_style curly
detect_urls yes

# Tab bar
active_tab_foreground   #15161e
active_tab_background   #7aa2f7
inactive_tab_foreground #565f89
inactive_tab_background #1a1b26

# Window border
active_border_color #7aa2f7
inactive_border_color #414868

# --- Window ---
window_padding_width 6
confirm_os_window_close 0
hide_window_decorations yes

# --- Scrollback ---
scrollback_lines 10000

# --- Bell ---
enable_audio_bell no
visual_bell_duration 0

# --- Performance ---
repaint_delay 6
input_delay 1
sync_to_monitor yes
