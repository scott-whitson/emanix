# High-contrast light scheme (tuned for visual snow — warm off-white bg
# to avoid pure-#FFFFFF glare; near-black fg; all palette colors dark and
# saturated so WCAG contrast against the bg is >= 7:1 across the board.
# Indices 7 and 15 are forced very dark so apps that emit ANSI "white" or
# "bright white" still render readable text on a light background.)

foreground = #1A1A1A
background = #F7F3EC
background-opacity = 0.05

# Normal palette (0-7)
palette = 0=#1A1A1A
palette = 1=#A80000
palette = 2=#14640A
palette = 3=#7A4A00
palette = 4=#003FA3
palette = 5=#8A0F6E
palette = 6=#006B6B
palette = 7=#2E2E2E

# Bright palette (8-15)
palette = 8=#4A4A4A
palette = 9=#C20000
palette = 10=#1E7A1E
palette = 11=#8A5A00
palette = 12=#0F52D0
palette = 13=#A31E8A
palette = 14=#007878
palette = 15=#000000

# Cursor
cursor-color = #1A1A1A
cursor-text = #F7F3EC

# Selection — high-contrast amber highlight
selection-foreground = #1A1A1A
selection-background = #FFD59E

# Bold text stays dark (don't let bold map to bright-white)
bold-is-bright = false
