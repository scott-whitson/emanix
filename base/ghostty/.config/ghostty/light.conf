# Baseline light theme — colors mapped from Claude Code's light-daltonized
# palette (green -> blue-teal shift for colorblind-friendly readability,
# softer saturation than previous high-contrast scheme). Indices 7 and 15
# are forced dark so apps emitting ANSI "white" or "bright white" stay
# readable on a white background.

foreground = #000000
background = #F7F3EC
background-opacity = 0.80

# Normal palette (0-7)
palette = 0=#000000
palette = 1=#CC0000
palette = 2=#006699
palette = 3=#FF9900
palette = 4=#0066CC
palette = 5=#8700FF
palette = 6=#00B2B2
palette = 7=#2E2E2E

# Bright palette (8-15)
palette = 8=#666666
palette = 9=#CC0000
palette = 10=#0099CC
palette = 11=#FFB733
palette = 12=#3366FF
palette = 13=#A64DFF
palette = 14=#33C5C5
palette = 15=#000000
