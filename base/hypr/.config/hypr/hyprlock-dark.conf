# -----------------------------------------------
# Hyprlock — dark (Tokyo Night)
# -----------------------------------------------

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(1a1b26ff)
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -80
    halign = center
    valign = center
    outline_thickness = 2
    outer_color = rgba(7aa2f7ff)
    inner_color = rgba(1a1b26cc)
    font_color = rgba(c0caf5ff)
    fade_on_empty = false
    placeholder_text =
    check_color = rgba(9ece6aff)
    fail_color = rgba(f7768eff)
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%-I:%M %p')"
    color = rgba(c0caf5ff)
    font_size = 80
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(a9b1d6ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}
