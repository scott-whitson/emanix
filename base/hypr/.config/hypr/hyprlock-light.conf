# -----------------------------------------------
# Hyprlock — high-contrast light
# -----------------------------------------------

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(F7F3ECff)
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -80
    halign = center
    valign = center
    outline_thickness = 2
    outer_color = rgba(0F52D0ff)
    inner_color = rgba(FFFFFFee)
    font_color = rgba(1A1A1Aff)
    fade_on_empty = false
    placeholder_text =
    check_color = rgba(14640Aff)
    fail_color = rgba(A80000ff)
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%-I:%M %p')"
    color = rgba(1A1A1Aff)
    font_size = 80
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(4A4A4Aff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}
