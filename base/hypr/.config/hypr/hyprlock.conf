# -----------------------------------------------
# Hyprlock — minimal lock screen
# -----------------------------------------------

general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

# Solid Tokyo Night background (matches sway's #1a1b26)
background {
    monitor =
    color = rgba(1a1b26ff)
}

# Password input
input-field {
    monitor =
    size = 300, 50
    position = 0, -80
    halign = center
    valign = center
    outline_thickness = 2
    outer_color = rgba(7aa2f7ff)
    inner_color = rgba(1a1b26cc)
    font_color = rgba(c0caf5ff)
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    check_color = rgba(9ece6aff)
    fail_color = rgba(f7768eff)
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(c0caf5ff)
    font_size = 80
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(a9b1d6ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}
