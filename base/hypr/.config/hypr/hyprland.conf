# -----------------------------------------------
# Hyprland Configuration
# -----------------------------------------------

# --- Mod key ---
$mod = SUPER

# --- Terminal & launcher ---
$term = ghostty
$menu = fuzzel

# --- Theme (swapped by theme-switch; see base/hypr/.config/hypr/colors/) ---
source = ~/.config/hypr/colors/theme.conf

# -----------------------------------------------
# Monitors
# -----------------------------------------------
monitor = HDMI-A-1, preferred, 0x0, 1
monitor = eDP-1, preferred, 0x1080, 1
monitor = , preferred, auto, 1

# -----------------------------------------------
# Autostart
# -----------------------------------------------
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

# Restart portal so it picks up hyprland env (fixes stale xdp-wlr from prior sway session)
exec-once = systemctl --user restart xdg-desktop-portal

exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = $term

# Wallpaper: fragpaper (theme-aware via fragpaper-launch wrapper; reload with $mod+Ctrl+p)
exec-once = bash -c '~/.local/bin/fragpaper-launch > /tmp/fragpaper-debug.log 2>&1'

# -----------------------------------------------
# Input
# -----------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# Hide cursor after 5s idle
cursor {
    inactive_timeout = 5
}

# -----------------------------------------------
# General appearance
# -----------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 4
    col.active_border = $col_active
    col.inactive_border = $col_inactive
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 4
    shadow {
        enabled = false
    }
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        xray = false
    }
}

animations {
    enabled = true
    bezier = smooth, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 3, smooth
    animation = fade, 1, 3, smooth
    animation = workspaces, 1, 3, smooth
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

# -----------------------------------------------
bind = $mod, Return, exec, $term
bind = $mod, c, exec, ~/.local/bin/quick-calc
bind = $mod, d, exec, $menu
bind = $mod, w, exec, firefox
bind = $mod SHIFT, w, exec, ~/.local/bin/weather-3day
bind = $mod CTRL, w, exec, ~/.local/bin/weather-hourly
bind = $mod ALT, p, exec, firefox --private-window
bind = $mod, e, exec, $term -e lf
bind = $mod, o, exec, obsidian

# -----------------------------------------------
# Keybindings — Window management
# -----------------------------------------------
bind = $mod SHIFT, q, killactive,
bind = $mod SHIFT, space, togglefloating,
bind = $mod, f, fullscreen, 0
bind = $mod, v, layoutmsg, preselect t   # next split below (dwindle)
bind = $mod, b, layoutmsg, preselect l   # next split right

# Focus (vim-style)
bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r

# Move windows
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, l, movewindow, r

# Resize (no modes in hyprland; use CTRL+hjkl held to resize)
binde = $mod CTRL, h, resizeactive, -40 0
binde = $mod CTRL, j, resizeactive, 0 40
binde = $mod CTRL, k, resizeactive, 0 -40
binde = $mod CTRL, l, resizeactive, 40 0

# Mouse drag/resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Window picker (digit-labeled overlay on each visible window; press digit to focus)
bind = $mod, Tab, exec, ~/.local/bin/window-picker

# -----------------------------------------------
# Keybindings — Workspaces
# -----------------------------------------------
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bind = $mod, s, workspace, m+1
bind = $mod, a, workspace, m-1

# Scratchpad (hyprland special workspace)
bind = $mod SHIFT, minus, movetoworkspace, special
bind = $mod, minus, togglespecialworkspace

# -----------------------------------------------
# Keybindings — Session
# -----------------------------------------------
bind = $mod SHIFT, e, exit,
bind = $mod SHIFT, r, exec, hyprctl reload
bind = $mod SHIFT, t, exec, ~/.local/bin/theme-switch
bind = $mod SHIFT, m, exec, ~/.local/bin/trackpad-toggle
bind = $mod, Escape, exec, hyprlock

# -----------------------------------------------
# Screenshots
# -----------------------------------------------
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim -g "$(slurp)" ~/downloads/screenshot-$(date +%Y%m%d-%H%M%S).png
bind = CTRL, Print, exec, grim - | wl-copy

# -----------------------------------------------
# Media & brightness keys
# -----------------------------------------------
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# -----------------------------------------------
# Wallpaper (fragpaper) reload
# -----------------------------------------------
bind = $mod CTRL, p, exec, pkill -USR1 fragpaper

# -----------------------------------------------
# Push-to-talk
# -----------------------------------------------
bind = $mod, F1, exec, ~/dotfiles/tools/push-to-talk.sh toggle
bind = , F1, exec, ~/dotfiles/tools/push-to-talk.sh toggle
