# -----------------------------------------------
# Hyprland Configuration
# -----------------------------------------------

# --- Monitor ---
# Auto-detect and use preferred resolution
monitor = , preferred, auto, 1

# --- Autostart ---
exec-once = waybar
exec-once = dunst
exec-once = hyprpaper
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# --- Environment ---
env = XCURSOR_SIZE, 24
env = QT_QPA_PLATFORM, wayland
env = QT_QPA_PLATFORMTHEME, qt5ct

# --- Input ---
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# --- General ---
general {
    gaps_in = 4
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(8dbcffee) rgba(7aa2f7ee) 45deg
    col.inactive_border = rgba(565f89aa)
    resize_on_border = true
    layout = dwindle
}

# --- Decoration ---
decoration {
    rounding = 8

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1a2eee)
    }

    active_opacity = 1.0
    inactive_opacity = 0.95
}

# --- Animations ---
animations {
    enabled = true

    bezier = ease, 0.25, 0.1, 0.25, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smooth, 0.5, 0, 0.99, 0.99

    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 5, ease, slide
    animation = fade, 1, 4, smooth
    animation = workspaces, 1, 4, ease, slide
    animation = border, 1, 10, default
}

# --- Layout ---
dwindle {
    pseudotile = true
    preserve_split = true
}

# --- Misc ---
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# -----------------------------------------------
# Key Bindings
# -----------------------------------------------

$mod = SUPER

# --- Apps ---
bind = $mod, Return, exec, kitty
bind = $mod, W, exec, firefox
bind = $mod, D, exec, wofi --show drun
bind = $mod, E, exec, thunar

# --- Window management ---
bind = $mod SHIFT, Q, killactive
bind = $mod SHIFT, Space, togglefloating
bind = $mod, F, fullscreen
bind = $mod, T, pseudo
bind = $mod, V, togglesplit

# --- Focus (vim-style) ---
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# --- Move windows ---
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# --- Resize windows ---
binde = $mod CTRL, H, resizeactive, -40 0
binde = $mod CTRL, J, resizeactive, 0 40
binde = $mod CTRL, K, resizeactive, 0 -40
binde = $mod CTRL, L, resizeactive, 40 0

# --- Workspaces ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# --- Move to workspace ---
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# --- Workspace navigation ---
bind = $mod, S, workspace, e+1
bind = $mod, A, workspace, e-1

# --- Mouse ---
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# --- Screenshots ---
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy

# --- Media keys ---
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind  = , XF86AudioPlay, exec, playerctl play-pause
bind  = , XF86AudioNext, exec, playerctl next
bind  = , XF86AudioPrev, exec, playerctl previous
binde = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# --- Session ---
bind = $mod SHIFT, E, exit
