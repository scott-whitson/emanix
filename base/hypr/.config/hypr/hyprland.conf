# -----------------------------------------------
# Hyprland Configuration
# -----------------------------------------------

# --- Mod key ---
$mod = SUPER

# --- Terminal & launcher ---
$term = ghostty
$menu = fuzzel

# --- Theme (swapped by theme-switch; see base/hypr/.config/hypr/colors/) ---
source = ~/.config/hypr/theme.conf

# -----------------------------------------------
# Monitors
# -----------------------------------------------
monitor = HDMI-A-1, preferred, 0x0, 1
monitor = eDP-1, preferred, 0x1080, 1
monitor = , preferred, auto, 1

# -----------------------------------------------
# Environment
# -----------------------------------------------
# Make Flatpak app .desktop files visible to launchers (fuzzel, etc.)
env = XDG_DATA_DIRS,/var/lib/flatpak/exports/share:$HOME/.local/share/flatpak/exports/share:/usr/local/share:/usr/share

# -----------------------------------------------
# Autostart
# -----------------------------------------------
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE XDG_DATA_DIRS
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE XDG_DATA_DIRS

# Restart portal so it picks up hyprland env (fixes stale xdp-wlr from prior sway session)
exec-once = systemctl --user restart xdg-desktop-portal

exec-once = systemctl --user start hyprpolkitagent
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = $term

# Wallpaper: fragpaper (theme-aware via fragpaper service; reload with $mod+Ctrl+p)
exec-once = systemctl --user start fragpaper.service

# Nextcloud sync daemon retired; Syncthing handles docs

# -----------------------------------------------
# Input
# -----------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# Hide cursor after 5s idle
cursor {
    inactive_timeout = 5
}

# -----------------------------------------------
# General appearance
# -----------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 4
    col.active_border = $col_active
    col.inactive_border = $col_inactive
    layout = master
    resize_on_border = true
}

master {
    mfact = 0.55          # master area takes 55% of screen
    orientation = left    # master on left; cycle with $mod+y
    new_status = slave    # new windows join slave stack (don't steal master)
    new_on_top = false    # slaves appended to bottom
    smart_resizing = true
}

decoration {
    rounding = 4
    shadow {
        enabled = false
    }
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        xray = false
    }
}

windowrule = no_blur on, match:class com.mitchellh.ghostty
windowrule = match:title hypr-weather-sat, float on
windowrule = match:title hypr-weather-sat, center on
windowrule = match:title hypr-cheatsheet, float on
windowrule = match:title hypr-cheatsheet, center on
windowrule = match:title hypr-cheatsheet, size 960 730

animations {
    enabled = true
    bezier = smooth, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 3, smooth
    animation = fade, 1, 3, smooth
    animation = workspaces, 1, 3, smooth
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

# -----------------------------------------------
bind = $mod, Return, exec, $term
bind = $mod, d, exec, $menu
bind = $mod, w, exec, ~/.local/bin/firefox
bind = $mod ALT, p, exec, ~/.local/bin/firefox --private-window
bind = $mod, e, exec, thunar
bind = $mod, o, exec, ~/.local/bin/obsidian

# -----------------------------------------------
# Keybindings — Window management
# -----------------------------------------------
bind = $mod SHIFT, q, killactive,
bind = $mod SHIFT, space, togglefloating,
bind = $mod, f, fullscreen, 0

# Master-layout window management
bind = $mod,       m,      layoutmsg, focusmaster auto    # jump to/from master
bind = $mod SHIFT, Return, layoutmsg, swapwithmaster master  # promote to master
bind = $mod,       y,      layoutmsg, orientationcycle    # left/top/right/bottom/center

# Focus (vim-style)
bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r

# Move windows
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, l, movewindow, r

# Resize — h/l adjust the master split ratio (mfact);
# j/k resize the focused window within the slave stack
binde = $mod CTRL, h, layoutmsg, mfact -0.05
binde = $mod CTRL, l, layoutmsg, mfact +0.05
binde = $mod CTRL, j, resizeactive, 0 40
binde = $mod CTRL, k, resizeactive, 0 -40

# Mouse drag/resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Window picker (digit-labeled overlay on each visible window; press digit to focus)
bind = $mod, Tab, exec, ~/.local/bin/window-picker

# Rename current workspace (zellij-style; fuzzel prompt, empty input clears)
bind = $mod, r, exec, ~/.local/bin/hypr-rename-workspace

# Cheatsheet popup (reads ~/docs/vault/Whitsgrove/Hyprland Cheatsheet.md)
bind = $mod SHIFT, slash, exec, ~/.local/bin/hypr-cheatsheet

# -----------------------------------------------
# Keybindings — Tools (custom popups & helpers)
# -----------------------------------------------
bind = $mod, i, exec, ghostty -e ~/.local/bin/hypr-wifi      # WiFi connection helper
bind = $mod, c, exec, ~/.local/bin/hypr-calc       # Quick calculator
bind = $mod, n, exec, ~/.local/bin/hypr-weather    # Phoenix NY weather + NOAA satellite
bind = $mod, u, exec, ~/.local/bin/hypr-or-cost    # OpenRouter 7-day cost
bind = $mod, p, exec, ghostty -e pi  # Pi AI coding assistant

# -----------------------------------------------
# Keybindings — Workspaces
# -----------------------------------------------
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9

bind = $mod, s, workspace, m+1
bind = $mod, a, workspace, m-1

# Scratchpad (hyprland special workspace)
bind = $mod SHIFT, minus, movetoworkspace, special
bind = $mod, minus, togglespecialworkspace

# -----------------------------------------------
# Keybindings — Session
# -----------------------------------------------
bind = $mod SHIFT, e, exit,
bind = $mod SHIFT, r, exec, hyprctl reload
bind = $mod SHIFT, t, exec, ~/dotfiles/bin/dot-theme-toggle
bind = $mod SHIFT, m, exec, ~/.local/bin/trackpad-toggle
bind = $mod, Escape, exec, hyprlock

# -----------------------------------------------
# Screenshots
# -----------------------------------------------
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim -g "$(slurp)" ~/downloads/screenshot-$(date +%Y%m%d-%H%M%S).png
bind = CTRL, Print, exec, grim - | wl-copy

# -----------------------------------------------
# Media & brightness keys
# -----------------------------------------------
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
binde = , XF86MonBrightnessUp, exec, ~/.local/bin/hypr-brightness up
binde = , XF86MonBrightnessDown, exec, ~/.local/bin/hypr-brightness down
binde = , F3, exec, ~/.local/bin/hypr-brightness up
binde = , F2, exec, ~/.local/bin/hypr-brightness down

# -----------------------------------------------
# Wallpaper (fragpaper) reload
# -----------------------------------------------
bind = $mod CTRL, p, exec, pkill -USR1 fragpaper

# -----------------------------------------------
# Push-to-talk
# -----------------------------------------------
bind = $mod, F1, exec, ~/dotfiles/tools/stt/push-to-talk.sh toggle
bind = , F1, exec, ~/dotfiles/tools/stt/push-to-talk.sh toggle

# XWayland
xwayland {
    force_zero_scaling = true
}
