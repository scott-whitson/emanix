general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Dim screen before lock
listener {
    timeout = 1500              # 25 min
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Lock screen
listener {
    timeout = 1800              # 30 min
    on-timeout = loginctl lock-session
}

# Turn off displays
listener {
    timeout = 1860              # 31 min
    on-timeout = hyprctl dispatch dpms off
    # SIGUSR2 → fragpaper rebuilds EGL surfaces (DPMS may have invalidated them).
    # SIGUSR1 toggles pause and would *pause* fragpaper if it was running.
    on-resume = hyprctl dispatch dpms on && pkill -USR2 fragpaper
}
