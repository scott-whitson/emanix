# Silence ACP-related warnings at boot:
#   "Failed to create 'api.alsa.acp.device' device"
#   "Path Mic ACP LED is not a volume or mute control" (×2)
#   "spa-node-factory failed to create node"
#
# These come from WirePlumber probing the AMD ACP platform device which exposes
# a non-standard LED control. The ACP split-device feature tries to open
# hw:acp and fails because the ALSA ACP plugin isn't available. Disabling split
# mode prevents this probe entirely — the real audio cards (HDMI + HDA) are
# still enumerated normally through their PCI device paths.
monitor.alsa.properties = {
  api.alsa.split-enable = false
}
