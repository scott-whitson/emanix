openapi: 3.1.0
info:
  title: Datacore Bootstrap API
  version: 0.1.0
  summary: Device enrollment and bootstrap contract for blank-machine Ventoy flow.
  description: |
    Contract for the first-boot enrollment flow used by ventoy/bootstrap.sh.

    Flow:
      1. Client creates a bootstrap session.
      2. User signs in on datacore and approves device in browser.
      3. Client polls session until approved.
      4. Datacore returns short-lived bootstrap token plus Headscale and dotfiles source data.
      5. Client joins Headscale, fetches dotfiles, runs repo bootstrap, then reports completion.

    Browser/UI routes may use normal datacore user session auth. Client-side bootstrap
    endpoints are session-scoped and rely on the unguessable session_id plus short TTL.
servers:
  - url: https://datacore.example
    description: Datacore production example
  - url: https://datacore.local
    description: Local development example
security: []
tags:
  - name: BootstrapSessions
    description: Session create, poll, approve, complete.
  - name: BootstrapUI
    description: Human verification page used by the browser step.
paths:
  /api/bootstrap/sessions:
    post:
      tags: [BootstrapSessions]
      operationId: createBootstrapSession
      summary: Create bootstrap session
      description: Start device enrollment. Returns a session ID and verification URL for the browser step.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapSessionCreateRequest"
            examples:
              desktop:
                value:
                  device_name: fjord
                  hostname: fjord
                  role: desktop
                  client: ventoy-bootstrap
      responses:
        "201":
          description: Bootstrap session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapSessionCreateResponse"
              examples:
                created:
                  value:
                    session_id: bs_123
                    device_code: K7Q9-4M2P
                    verification_url: https://datacore.example/bootstrap/bs_123
                    expires_at: "2026-06-03T18:30:00Z"
                    poll_interval_seconds: 5
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/bootstrap/sessions/{session_id}:
    get:
      tags: [BootstrapSessions]
      operationId: getBootstrapSession
      summary: Poll bootstrap session
      description: Poll until datacore approves, denies, or expires the session.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BootstrapSessionPendingResponse"
                  - $ref: "#/components/schemas/BootstrapSessionDeniedResponse"
                  - $ref: "#/components/schemas/BootstrapSessionApprovedResponse"
              examples:
                pending:
                  value:
                    state: pending
                approved:
                  value:
                    state: approved
                    bootstrap_token: dc_boot_abc
                    headscale_login_server: https://headscale.datacore.example
                    dotfiles_archive_url: https://datacore.example/api/bootstrap/sessions/bs_123/dotfiles.tar.gz
                    dotfiles_git_url: ssh://scott@datacore/~/projects/dotfiles
                    device_id: dev_456
                    hostname: fjord
                    expires_at: "2026-06-03T18:20:00Z"
                denied:
                  value:
                    state: denied
                    message: Device rejected by user
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
  /api/bootstrap/sessions/{session_id}/approve:
    post:
      tags: [BootstrapSessions]
      operationId: approveBootstrapSession
      security:
        - cookieAuth: []
      summary: Approve bootstrap session
      description: |
        Optional API form for the browser flow. The browser UI may call this after the
        user logs in and confirms the device name/role.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapSessionApproveRequest"
            examples:
              approve:
                value:
                  device_name: fjord
                  confirm_role: desktop
      responses:
        "200":
          description: Session approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapSessionApproveResponse"
              examples:
                ok:
                  value:
                    state: approved
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/bootstrap/sessions/{session_id}/complete:
    post:
      tags: [BootstrapSessions]
      operationId: completeBootstrapSession
      summary: Complete bootstrap session
      description: Report success after Headscale join, dotfiles fetch, and repo bootstrap finish.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapSessionCompleteRequest"
            examples:
              ok:
                value:
                  status: ok
                  device_name: fjord
                  role: desktop
                  hostname: fjord
                  device_id: dev_456
      responses:
        "200":
          description: Completion acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapSessionCompleteResponse"
              examples:
                ok:
                  value:
                    state: acknowledged
                    session_id: bs_123
                    received_at: "2026-06-03T18:25:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /bootstrap/{session_id}:
    get:
      tags: [BootstrapUI]
      operationId: getBootstrapVerificationPage
      security:
        - cookieAuth: []
      summary: Bootstrap verification page
      description: Browser page where the user logs in and approves the device.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: HTML verification page
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
      description: Unguessable bootstrap session identifier.
  responses:
    BadRequest:
      description: Request invalid or missing required fields.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Session not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Gone:
      description: Session expired or no longer available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: datacore_session
      description: Datacore browser session cookie used by approval UI routes.
  schemas:
    BootstrapSessionCreateRequest:
      type: object
      additionalProperties: false
      required:
        - device_name
      properties:
        device_name:
          type: string
          minLength: 1
          description: Friendly device label entered by user.
        hostname:
          type: string
          minLength: 1
          description: Desired hostname. Defaults to device_name.
        role:
          type: string
          minLength: 1
          description: Device profile or role, such as desktop.
          default: desktop
        client:
          type: string
          minLength: 1
          description: Client identifier for audit and debugging.
          default: ventoy-bootstrap
        machine_ssh_public_key:
          type: string
          minLength: 1
          description: OpenSSH public key for phase-1 reciprocal SSH trust. Datacore installs it so it can SSH into the machine without a password.
    BootstrapSessionCreateResponse:
      type: object
      additionalProperties: false
      required:
        - session_id
        - verification_url
        - expires_at
        - poll_interval_seconds
      properties:
        session_id:
          type: string
          description: Bootstrap session ID.
        device_code:
          type: string
          description: Short code shown to user as a manual verification aid.
        verification_url:
          type: string
          format: uri
          description: URL the user opens in browser to sign in and approve.
        expires_at:
          type: string
          format: date-time
          description: Session expiry timestamp.
        poll_interval_seconds:
          type: integer
          minimum: 1
          description: Poll interval for client.
          default: 5
    BootstrapSessionPendingResponse:
      type: object
      additionalProperties: false
      required:
        - state
      properties:
        state:
          type: string
          enum: [pending, waiting]
    BootstrapSessionDeniedResponse:
      type: object
      additionalProperties: false
      required:
        - state
        - message
      properties:
        state:
          type: string
          enum: [denied, expired, rejected]
        message:
          type: string
          description: Human-readable reason.
    BootstrapSessionApprovedResponse:
      type: object
      additionalProperties: false
      required:
        - state
        - bootstrap_token
        - headscale_login_server
      properties:
        state:
          type: string
          enum: [approved]
        bootstrap_token:
          type: string
          description: Short-lived, one-time Headscale enrollment token. Approved polls may echo same token until expiry; client uses it once.
        headscale_login_server:
          type: string
          format: uri
          description: Headscale login server URL.
        dotfiles_archive_url:
          type: string
          format: uri
          description: Preferred dotfiles bundle archive URL.
        dotfiles_git_url:
          type: string
          description: Alternative dotfiles git URL.
        device_id:
          type: string
          description: Datacore device identifier.
        hostname:
          type: string
          description: Approved hostname.
        expires_at:
          type: string
          format: date-time
          description: Bootstrap token expiry timestamp.
        ssh_trust_bundle:
          $ref: "#/components/schemas/SshTrustBundle"
    BootstrapSessionApproveRequest:
      type: object
      additionalProperties: false
      required:
        - device_name
      properties:
        device_name:
          type: string
          minLength: 1
          description: Device name confirmed by user.
        confirm_role:
          type: string
          minLength: 1
          description: Confirmed role/profile.
    BootstrapSessionApproveResponse:
      type: object
      additionalProperties: false
      required:
        - state
      properties:
        state:
          type: string
          enum: [approved]
    SshTrustBundle:
      type: object
      additionalProperties: false
      required:
        - ssh_user
        - known_hosts
      properties:
        ssh_user:
          type: string
          description: SSH user the machine should use when connecting to datacore.
        known_hosts:
          type: string
          description: Known_hosts text block or host key lines for datacore.
        ssh_config_snippet:
          type: string
          description: Optional SSH config snippet for datacore access.
        host_ca_public_key:
          type: string
          description: Optional SSH host CA public key for datacore if CA-based trust is used later.
    BootstrapSessionCompleteRequest:
      type: object
      additionalProperties: false
      required:
        - status
        - bootstrap_token
        - device_name
        - role
        - hostname
      properties:
        status:
          type: string
          enum: [ok, error]
          description: Final bootstrap status.
        bootstrap_token:
          type: string
          description: Token returned by approval and required to complete bootstrap.
        device_name:
          type: string
          minLength: 1
        role:
          type: string
          minLength: 1
        hostname:
          type: string
          minLength: 1
        device_id:
          type: string
          description: Optional datacore device identifier.
        message:
          type: string
          description: Optional human-readable note.
        exit_code:
          type: integer
          description: Optional process exit code.
    BootstrapSessionCompleteResponse:
      type: object
      additionalProperties: false
      required:
        - state
        - session_id
        - received_at
      properties:
        state:
          type: string
          enum: [acknowledged]
        session_id:
          type: string
        received_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
