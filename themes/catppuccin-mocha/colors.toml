# Catppuccin Mocha - single source of truth for all themed apps.
# Source: https://catppuccin.com/palette
#
# This file is the ONLY hand-edited color definition in this theme dir.
# Other configs are generated from it via:
#   - omarchy-theme-gen (sed-substitutes {{ key }} and {{ key_rgb }})
#   - gen-pi-theme.py  -> pi-agent-theme.json
#
# Sections:
#   [ui]         -> accent, foreground, backgrounds, cursor
#   [ansi]       -> color0..color15 (terminal 16)
#   [catppuccin] -> full semantic palette for pi agent / nvim / etc.

[ui]
accent = "#89b4fa"
foreground = "#cdd6f4"
background = "#1e1e2e"
cursor = "#f5e0dc"
selection_foreground = "#1e1e2e"
selection_background = "#f5e0dc"

