# -----------------------------------------------
# Hyprlock — Catppuccin Mocha
# -----------------------------------------------

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(1e1e2ee6)
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -80
    halign = center
    valign = center
    outline_thickness = 2
    outer_color = rgba(89b4faff)
    inner_color = rgba(181825d0)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    placeholder_text =
    check_color = rgba(a6e3a1ff)
    fail_color = rgba(f38ba8ff)
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%-I:%M %p')"
    color = rgba(cdd6f4ff)
    font_size = 80
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(a6adc8ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}
