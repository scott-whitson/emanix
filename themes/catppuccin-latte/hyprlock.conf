# -----------------------------------------------
# Hyprlock — Catppuccin Latte
# -----------------------------------------------

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(eff1f5e6)
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -80
    halign = center
    valign = center
    outline_thickness = 2
    outer_color = rgb(0d47a1)
    inner_color = rgba(e6e9efd0)
    font_color = rgb(1a1c28)
    fade_on_empty = false
    placeholder_text =
    check_color = rgba(2d5016ff)
    fail_color = rgb(991122)
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%-I:%M %p')"
    color = rgb(1a1c28)
    font_size = 80
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgb(3c3e4f)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}
