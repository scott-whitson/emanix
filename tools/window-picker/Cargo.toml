[package]
name = "window-picker"
version = "0.1.0"
edition = "2021"
description = "Hyprland per-window ace-jump window picker"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
gtk4 = "0.11.2"
gtk4-layer-shell = "0.8.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
